<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Notes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f0ff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      background: white;
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
      flex-shrink: 0;
    }
    header h1 { font-size: 20px; font-weight: 800; color: #1a1a1a; letter-spacing: -0.3px; }
    .sync-badge {
      font-size: 11px; font-weight: 600;
      padding: 3px 8px; border-radius: 20px;
      transition: all 0.3s;
    }
    .sync-badge.saved   { color: #22c55e; background: #f0fdf4; }
    .sync-badge.pending { color: #f59e0b; background: #fffbeb; }
    .sync-badge.error   { color: #ef4444; background: #fef2f2; }

    /* ── FORMAT BAR ── */
    .format-bar {
      background: white;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #f0e8ff;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .format-bar::-webkit-scrollbar { display: none; }
    .fmt-btn {
      min-width: 26px; height: 26px;
      border: 1px solid #e8e0f8;
      background: #f8f5ff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: #4a4a4a;
      display: flex; align-items: center; justify-content: center;
    }
    .fmt-btn:active { background: #e8d0ff; border-color: #c8a0f0; }
    .fmt-sep { width: 1px; height: 16px; background: #e8e0f8; margin: 0 2px; }
    .fmt-size {
      height: 26px;
      border: 1px solid #e8e0f8;
      background: #f8f5ff;
      border-radius: 6px;
      font-size: 11px;
      color: #4a4a4a;
      padding: 0 4px;
      cursor: pointer;
      outline: none;
      max-width: 46px;
      font-family: inherit;
    }
    .fmt-circle {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.6);
      outline: 1.5px solid rgba(0,0,0,0.12);
      cursor: pointer;
      flex-shrink: 0;
    }
    .fmt-clear {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.6);
      outline: 1.5px solid rgba(0,0,0,0.15);
      background: #ede8f8;
      cursor: pointer;
      font-size: 9px;
      color: #999;
      display: flex; align-items: center; justify-content: center;
      padding: 0; flex-shrink: 0;
    }
    .fmt-clear:active { background: #d4b8ff; color: #a100ff; }

    /* ── IMAGE RESIZE ── */
    .img-selected { outline: 2px solid #a100ff; border-radius: 2px; cursor: pointer; }
    .img-toolbar {
      position: fixed;
      background: white;
      border: 1px solid #e8e0f8;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      padding: 4px 8px;
      display: none;
      align-items: center;
      gap: 4px;
      z-index: 1000;
    }
    .img-toolbar span { font-size: 10px; color: #bbb; margin-right: 2px; }
    .img-toolbar button {
      padding: 3px 7px;
      border: 1px solid #e8e0f8;
      background: #f8f5ff;
      border-radius: 5px;
      cursor: pointer;
      color: #4a4a4a;
      font-size: 11px;
      font-family: inherit;
    }
    .img-toolbar button:hover { background: #e8d0ff; border-color: #c8a0f0; }

    /* ── NOTES AREA ── */
    .notes-area {
      flex: 1;
      overflow-y: auto;
      background: white;
      margin: 12px;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
      outline: none;
      font-size: 16px;
      line-height: 1.7;
      color: #1a1a1a;
      -webkit-overflow-scrolling: touch;
    }
    .notes-area:empty::before {
      content: "Start typing…";
      color: #ccc;
      pointer-events: none;
    }

    /* ── CHECKBOX ITEMS ── */
    .chk {
      cursor: pointer;
      user-select: none;
      color: #aaa;
      font-size: 1em;
    }
    .action-item.done {
      text-decoration: line-through;
      color: #bbb;
    }
    .action-item.done .chk {
      display: inline-block; /* breaks strikethrough line on the checkbox */
      text-decoration: none;
      color: #22c55e;
    }

    /* ── SEARCH OVERLAY ── */
    #search-overlay {
      position: fixed;
      top: 96px; left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1.5px solid #d4b8ff;
      border-radius: 20px;
      padding: 6px 14px;
      box-shadow: 0 4px 20px rgba(161,0,255,0.15);
      z-index: 1000;
    }
    #search-input {
      border: none; outline: none;
      font: inherit; font-size: 13px;
      color: #333; background: transparent;
      width: 180px;
    }
    #search-input::placeholder { color: #ccc; }
    #search-counter { font-size: 11px; color: #bbb; white-space: nowrap; min-width: 30px; }
    mark.sh { background: #fef08a; color: inherit; border-radius: 2px; }
    .tab-match-badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: #fef08a; color: #666; font-size: 9px; font-weight: 700;
      min-width: 14px; height: 14px; border-radius: 7px;
      padding: 0 3px; margin-left: 2px; flex-shrink: 0;
    }

    /* ── TABS ── */
    .tabs-area {
      margin-left: 10px;
      padding-left: 10px;
      border-left: 1px solid #e8e0f8;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .tab-btn {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 2px 8px 2px 10px;
      border: 1px solid #e8e0f8;
      background: #f8f5ff;
      border-radius: 20px;
      cursor: pointer;
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      user-select: none;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .tab-btn:hover { background: #ede8f8; }
    .tab-btn[draggable="true"] { cursor: pointer; }
    .tab-btn[draggable="true"]:active { cursor: pointer; }
    .tab-btn.active {
      background: #a100ff;
      color: white;
      border-color: #a100ff;
    }
    .tab-btn.active:hover { background: #8c00dd; }
    .tab-close {
      font-size: 12px;
      color: #ccc;
      cursor: pointer;
      line-height: 1;
      margin-left: 1px;
      flex-shrink: 0;
    }
    .tab-btn.active .tab-close { color: rgba(255,255,255,0.6); }
    .tab-close:hover { color: #ef4444 !important; }
    .tab-add {
      width: 20px; height: 20px;
      border: 1px solid #e8e0f8;
      background: #f8f5ff;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      color: #bbb;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      flex-shrink: 0;
      line-height: 1;
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-add:hover { color: #a100ff; border-color: #d4b8ff; }
    .tab-rename-input {
      border: none; outline: none;
      background: transparent;
      color: inherit;
      font: inherit;
      width: 60px;
      min-width: 20px;
    }

    /* ── NAV LINK ── */
    .nav-todo {
      position: fixed;
      bottom: 20px; right: 16px;
      background: #a100ff;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 18px rgba(161,0,255,0.3);
    }
  </style>
</head>
<body>

<header>
  <h1>Notes</h1>
  <span class="sync-badge pending" id="sync-badge">⏳ Loading…</span>
</header>

<div class="format-bar">
  <button class="fmt-btn" onclick="fmt('bold')"      title="Bold"><b>B</b></button>
  <button class="fmt-btn" onclick="fmt('italic')"    title="Italic"><i>I</i></button>
  <button class="fmt-btn" onclick="fmt('underline')" title="Underline"><u>U</u></button>
  <div class="fmt-sep"></div>
  <select class="fmt-size" onchange="fmtSize(this.value); this.value=''" title="Font size">
    <option value="" disabled selected>Aa</option>
    <option value="1">XS</option>
    <option value="2">S</option>
    <option value="3">M</option>
    <option value="5">L</option>
    <option value="7">XL</option>
  </select>
  <div class="fmt-sep"></div>
  <button class="fmt-circle" style="background:#1a1a1a" onclick="fmtColor('fore','#1a1a1a')" title="Noir"></button>
  <button class="fmt-circle" style="background:#a100ff" onclick="fmtColor('fore','#a100ff')" title="Violet"></button>
  <button class="fmt-circle" style="background:#ef4444" onclick="fmtColor('fore','#ef4444')" title="Rouge"></button>
  <button class="fmt-circle" style="background:#fef08a;outline-color:#d4c200" onclick="fmtColor('back','#fef08a')" title="Surligner jaune"></button>
  <div class="fmt-sep"></div>
  <button class="fmt-clear" onclick="fmtClear()" title="Clear formatting">✕</button>
  <div class="fmt-sep"></div>
  <button class="fmt-btn" onclick="insertCheckbox()" title="Action item (Ctrl+Shift+A)">☐</button>
  <button class="fmt-btn" onclick="insertLink()" title="Insert link (Ctrl+K)">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </svg>
  </button>
  <div class="tabs-area" id="tabs-area">
    <button class="tab-add" onclick="addTab()" title="New page">+</button>
  </div>
</div>

<div id="notes-content" class="notes-area" contenteditable="true" oninput="scheduleNotesSave()"></div>

<!-- Image resize toolbar -->
<div class="img-toolbar" id="img-toolbar">
  <span>Size:</span>
  <button onclick="resizeImg(25)">25%</button>
  <button onclick="resizeImg(50)">50%</button>
  <button onclick="resizeImg(75)">75%</button>
  <button onclick="resizeImg(100)">100%</button>
  <button onclick="resizeImg(null)" title="Original">↺</button>
</div>

<div id="search-overlay">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
  <input type="text" id="search-input" placeholder="Search all notes…" oninput="doSearch(this.value)" onkeydown="if(event.key==='Escape')closeSearch()">
  <span id="search-counter"></span>
  <span onclick="closeSearch()" style="cursor:pointer;color:#ccc;font-size:14px;line-height:1;padding-left:4px;">✕</span>
</div>

<a class="nav-todo" href="index.html">☑ TODO</a>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com.rproxy.goskope.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com.rproxy.goskope.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB1XfH0aY3CnUDAjA7Ll3VaFSYjqk0gcxo",
    authDomain: "todolist-93c54.firebaseapp.com",
    databaseURL: "https://todolist-93c54-default-rtdb.firebaseio.com",
    projectId: "todolist-93c54",
    storageBucket: "todolist-93c54.firebasestorage.app",
    messagingSenderId: "944174392488",
    appId: "1:944174392488:web:0dc9a1fb2fb8733f31e69d"
  };

  const app      = initializeApp(firebaseConfig);
  const db       = getDatabase(app);
  const notesRef = ref(db, 'notes');
  const el       = document.getElementById('notes-content');
  const badge    = document.getElementById('sync-badge');

  function setSyncBadge(state, label) {
    badge.textContent = label;
    badge.className   = 'sync-badge ' + state;
  }

  // ── Tabs state ─────────────────────────────────────
  let _tabs = {};
  let _activeTab = '';
  let _saveTimer = null;
  let _dragId = null;

  // ── Search state ────────────────────────────────────
  let _searchActive = false;
  let _searchCleanHtml = {};
  let _currentSearchTerm = '';

  function genTabId() {
    return 'tab_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  }

  function renderTabs() {
    const area = document.getElementById('tabs-area');
    area.querySelectorAll('.tab-btn').forEach(b => b.remove());
    const addBtn = area.querySelector('.tab-add');
    const sorted = Object.entries(_tabs).sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
    const hasMany = sorted.length > 1;
    for (const [id, tab] of sorted) {
      const btn = document.createElement('div');
      btn.className = 'tab-btn' + (id === _activeTab ? ' active' : '');
      btn.dataset.id = id;
      const nameSpan = document.createElement('span');
      nameSpan.className = 'tab-name';
      nameSpan.textContent = tab.title || 'Page';
      btn.appendChild(nameSpan);
      if (hasMany) {
        const closeEl = document.createElement('span');
        closeEl.className = 'tab-close';
        closeEl.textContent = '×';
        closeEl.addEventListener('click', (e) => { e.stopPropagation(); deleteTab(id); });
        btn.appendChild(closeEl);
      }
      // ── drag & drop reorder ──
      btn.setAttribute('draggable', 'true');
      btn.addEventListener('dragstart', (e) => {
        _dragId = id;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', id);
        setTimeout(() => { btn.style.opacity = '0.35'; btn.style.transform = 'scale(0.95)'; }, 0);
      });
      btn.addEventListener('dragend', () => {
        btn.style.opacity = '';
        btn.style.transform = '';
        _dragId = null;
      });
      btn.addEventListener('dragover', (e) => {
        if (!_dragId || _dragId === id) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });
      btn.addEventListener('drop', (e) => {
        e.preventDefault();
        if (!_dragId || _dragId === id) return;
        const area2 = document.getElementById('tabs-area');
        const dragBtn = area2.querySelector('[data-id="' + _dragId + '"]');
        if (!dragBtn) return;
        const rect = btn.getBoundingClientRect();
        if (e.clientX < rect.left + rect.width / 2) {
          area2.insertBefore(dragBtn, btn);
        } else {
          btn.insertAdjacentElement('afterend', dragBtn);
        }
        [...area2.querySelectorAll('.tab-btn')].forEach((b, i) => {
          const tid = b.dataset.id;
          if (_tabs[tid]) {
            _tabs[tid].order = i;
            set(ref(db, 'notes/tabs/' + tid + '/order'), i).catch(() => {});
          }
        });
        renderTabs();
      });
      // ── click / dblclick ──
      let _clickTimer = null;
      btn.addEventListener('click', () => {
        // ignore click if it was a drag
        if (!_dragId) {
          clearTimeout(_clickTimer);
          _clickTimer = setTimeout(() => switchTab(id), 200);
        }
      });
      btn.addEventListener('dblclick', (e) => {
        clearTimeout(_clickTimer);
        e.preventDefault();
        startRename(id, nameSpan);
      });
      area.insertBefore(btn, addBtn);
    }
    if (_searchActive && _currentSearchTerm) updateTabBadges(_currentSearchTerm);
  }

  function startRename(id, nameSpan) {
    const input = document.createElement('input');
    input.type = 'text';
    input.value = _tabs[id]?.title || '';
    input.className = 'tab-rename-input';
    nameSpan.replaceWith(input);
    input.focus(); input.select();
    const save = () => {
      const newTitle = input.value.trim() || 'Page';
      if (_tabs[id]) _tabs[id].title = newTitle;
      set(ref(db, 'notes/tabs/' + id + '/title'), newTitle).catch(() => {});
      input.replaceWith(nameSpan);
      nameSpan.textContent = newTitle;
    };
    input.addEventListener('blur', save);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); save(); }
      if (e.key === 'Escape') { input.replaceWith(nameSpan); }
    });
  }

  async function switchTab(id) {
    if (id === _activeTab) return;
    if (_searchActive && _searchCleanHtml[_activeTab] === undefined) {
      _searchCleanHtml[_activeTab] = el.innerHTML;
    }
    await flushSave();
    _activeTab = id;
    el.innerHTML = _searchCleanHtml[id] !== undefined ? _searchCleanHtml[id] : (_tabs[id]?.html || '');
    set(ref(db, 'notes/activeTab'), id).catch(() => {});
    renderTabs();
    if (_searchActive && _currentSearchTerm) {
      if (_searchCleanHtml[id] === undefined) _searchCleanHtml[id] = el.innerHTML;
      highlightInEl(el, _currentSearchTerm);
      const first = el.querySelector('mark.sh');
      if (first) first.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  window.addTab = async function() {
    await flushSave();
    const id = genTabId();
    const order = Object.keys(_tabs).length;
    _tabs[id] = { title: 'Page ' + (order + 1), html: '', order, updatedAt: Date.now() };
    _activeTab = id;
    el.innerHTML = '';
    set(ref(db, 'notes/tabs/' + id), _tabs[id]).catch(() => {});
    set(ref(db, 'notes/activeTab'), id).catch(() => {});
    renderTabs();
    el.focus();
  };

  window.deleteTab = async function(id) {
    if (Object.keys(_tabs).length <= 1) return;
    const tab = _tabs[id];
    const hasContent = tab?.html && tab.html.replace(/<[^>]*>/g, '').trim().length > 0;
    if (hasContent) {
      const title = tab.title || 'Page';
      if (!confirm(`Delete "${title}"? This page has content and cannot be recovered.`)) return;
    }
    if (id === _activeTab) {
      const others = Object.keys(_tabs).filter(k => k !== id);
      _activeTab = others[0];
      el.innerHTML = _tabs[_activeTab]?.html || '';
    }
    delete _tabs[id];
    remove(ref(db, 'notes/tabs/' + id)).catch(() => {});
    set(ref(db, 'notes/activeTab'), _activeTab).catch(() => {});
    renderTabs();
  };

  function flushSave() {
    clearTimeout(_saveTimer);
    _saveTimer = null;
    if (!_activeTab || !_tabs[_activeTab]) return Promise.resolve();
    const htmlToSave = (_searchActive && _searchCleanHtml[_activeTab] !== undefined)
      ? _searchCleanHtml[_activeTab] : el.innerHTML;
    _tabs[_activeTab].html = htmlToSave;
    _tabs[_activeTab].updatedAt = Date.now();
    return set(ref(db, 'notes/tabs/' + _activeTab), _tabs[_activeTab]).catch(() => {});
  }

  // ── Cross-tab search ──────────────────────────────
  window.openSearch = function() {
    _searchActive = true;
    if (_searchCleanHtml[_activeTab] === undefined) {
      _searchCleanHtml[_activeTab] = el.innerHTML;
    }
    const overlay = document.getElementById('search-overlay');
    overlay.style.display = 'flex';
    const input = document.getElementById('search-input');
    input.value = _currentSearchTerm || '';
    input.focus();
    if (input.value) doSearch(input.value);
  };

  window.closeSearch = function() {
    _searchActive = false;
    document.getElementById('search-overlay').style.display = 'none';
    _currentSearchTerm = '';
    if (_searchCleanHtml[_activeTab] !== undefined) {
      el.innerHTML = _searchCleanHtml[_activeTab];
    }
    _searchCleanHtml = {};
    document.querySelectorAll('.tab-match-badge').forEach(b => b.remove());
    document.getElementById('search-counter').textContent = '';
  };

  function highlightInEl(element, term) {
    if (!term) return 0;
    const regex = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    let count = 0;
    nodes.forEach(node => {
      const text = node.textContent;
      regex.lastIndex = 0;
      if (!regex.test(text)) return;
      regex.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let last = 0, match;
      while ((match = regex.exec(text)) !== null) {
        frag.appendChild(document.createTextNode(text.slice(last, match.index)));
        const mark = document.createElement('mark');
        mark.className = 'sh';
        mark.textContent = match[0];
        frag.appendChild(mark);
        last = regex.lastIndex;
        count++;
      }
      frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
    return count;
  }

  function countMatches(html, term) {
    if (!term || !html) return 0;
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    const text = tmp.textContent || '';
    const regex = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    return (text.match(regex) || []).length;
  }

  function updateTabBadges(term) {
    document.querySelectorAll('.tab-match-badge').forEach(b => b.remove());
    if (!term) return;
    const area = document.getElementById('tabs-area');
    for (const [id, tab] of Object.entries(_tabs)) {
      const html = id === _activeTab
        ? (_searchCleanHtml[id] !== undefined ? _searchCleanHtml[id] : el.innerHTML)
        : (tab.html || '');
      const count = countMatches(html, term);
      if (count > 0) {
        const btn = area.querySelector('[data-id="' + id + '"]');
        if (btn) {
          const badge = document.createElement('span');
          badge.className = 'tab-match-badge';
          badge.textContent = count;
          btn.appendChild(badge);
        }
      }
    }
  }

  window.doSearch = function(term) {
    _currentSearchTerm = term;
    if (_searchCleanHtml[_activeTab] === undefined) {
      _searchCleanHtml[_activeTab] = el.innerHTML;
    }
    el.innerHTML = _searchCleanHtml[_activeTab];
    const counter = document.getElementById('search-counter');
    if (!term) {
      counter.textContent = '';
      updateTabBadges('');
      return;
    }
    const currentCount = highlightInEl(el, term);
    let totalCount = currentCount;
    for (const [id, tab] of Object.entries(_tabs)) {
      if (id === _activeTab) continue;
      totalCount += countMatches(tab.html || '', term);
    }
    counter.textContent = totalCount > 0 ? totalCount + '' : 'aucun';
    counter.style.color = totalCount > 0 ? '#bbb' : '#ef4444';
    updateTabBadges(term);
    const first = el.querySelector('mark.sh');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };

  window.scheduleNotesSave = function() {
    clearTimeout(_saveTimer);
    setSyncBadge('pending', '⏳ Saving…');
    _saveTimer = setTimeout(() => {
      if (!_activeTab || !_tabs[_activeTab]) return;
      const htmlToSave = (_searchActive && _searchCleanHtml[_activeTab] !== undefined)
        ? _searchCleanHtml[_activeTab] : el.innerHTML;
      _tabs[_activeTab].html = htmlToSave;
      _tabs[_activeTab].updatedAt = Date.now();
      set(ref(db, 'notes/tabs/' + _activeTab), _tabs[_activeTab])
        .then(() => setSyncBadge('saved', '✓ Synced'))
        .catch(() => setSyncBadge('error', '✕ Network error'));
    }, 2000);
  };

  // ── Chargement initial ─────────────────────────────
  get(notesRef).then(snap => {
    const data = snap.val();
    if (data?.tabs && Object.keys(data.tabs).length > 0) {
      _tabs = data.tabs;
      _activeTab = (data.activeTab && _tabs[data.activeTab])
        ? data.activeTab : Object.keys(_tabs)[0];
    } else if (data?.html) {
      // Migrate old single-page format → first tab
      const id = genTabId();
      _tabs = { [id]: { title: 'Page 1', html: data.html, order: 0, updatedAt: Date.now() } };
      _activeTab = id;
      set(notesRef, { tabs: _tabs, activeTab: id }).catch(() => {});
    } else {
      const id = genTabId();
      _tabs = { [id]: { title: 'Page 1', html: '', order: 0, updatedAt: Date.now() } };
      _activeTab = id;
      set(notesRef, { tabs: _tabs, activeTab: id }).catch(() => {});
    }
    el.innerHTML = _tabs[_activeTab]?.html || '';
    renderTabs();
    setSyncBadge('saved', '✓ Synced');
  }).catch(() => {
    if (Object.keys(_tabs).length === 0) {
      const id = genTabId();
      _tabs = { [id]: { title: 'Page 1', html: '', order: 0 } };
      _activeTab = id;
      renderTabs();
    }
    setSyncBadge('error', '✕ Offline');
  });

  // ── Checkbox / action items ───────────────────────
  window.insertCheckbox = function() {
    el.focus();
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    range.deleteContents();

    const div = document.createElement('div');
    div.className = 'action-item';
    const chk = document.createElement('span');
    chk.className = 'chk';
    chk.textContent = '☐';
    const space = document.createTextNode(' ');
    div.appendChild(chk);
    div.appendChild(space);
    range.insertNode(div);

    const r = document.createRange();
    r.setStartAfter(space);
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);
    scheduleNotesSave();
  };

  // Links in contenteditable don't navigate natively — intercept and open manually
  el.addEventListener('click', e => {
    const link = e.target.closest('a[href]');
    if (link) { e.preventDefault(); window.open(link.href, '_blank', 'noopener,noreferrer'); return; }
  });

  el.addEventListener('click', e => {
    if (!e.target.classList.contains('chk')) return;
    const checked = e.target.textContent === '☑';
    e.target.textContent   = checked ? '☐' : '☑';
    e.target.style.color   = checked ? '' : '#22c55e';
    e.target.style.display = checked ? '' : 'inline-block';

    // Works with or without .action-item wrapper
    const parent = e.target.closest('.action-item') || e.target.parentElement;

    if (!checked) {
      // Strike through following siblings
      const s = document.createElement('s');
      s.className  = 'action-done-text';
      s.style.color = '#bbb';
      let node = e.target.nextSibling;
      while (node) {
        const next = node.nextSibling;
        s.appendChild(node);
        node = next;
      }
      if (s.childNodes.length) parent.appendChild(s);
    } else {
      // Restore following siblings
      const s = parent.querySelector('.action-done-text');
      if (s) {
        while (s.firstChild) parent.insertBefore(s.firstChild, s);
        s.remove();
      }
    }
    scheduleNotesSave();
  });

  // ── Image resize ──────────────────────────────────
  let _selImg = null;
  const imgTb = document.getElementById('img-toolbar');

  function positionImgToolbar(img) {
    const r = img.getBoundingClientRect();
    imgTb.style.left = Math.max(4, r.left) + 'px';
    imgTb.style.top  = Math.max(4, r.top - 44) + 'px';
    imgTb.style.display = 'flex';
  }

  function selectImg(img) {
    if (_selImg) _selImg.classList.remove('img-selected');
    _selImg = img;
    img.classList.add('img-selected');
    positionImgToolbar(img);
  }

  function deselectImg() {
    if (_selImg) _selImg.classList.remove('img-selected');
    _selImg = null;
    imgTb.style.display = 'none';
  }

  window.resizeImg = function(pct) {
    if (!_selImg) return;
    if (pct === null) { _selImg.style.width = ''; _selImg.style.height = ''; }
    else              { _selImg.style.width = pct + '%'; _selImg.style.height = 'auto'; }
    positionImgToolbar(_selImg);
    scheduleNotesSave();
  };

  el.addEventListener('click', e => {
    if (e.target.tagName === 'IMG') selectImg(e.target);
    else deselectImg();
  });
  imgTb.addEventListener('mousedown', e => e.stopPropagation());
  document.addEventListener('click', e => {
    if (!imgTb.contains(e.target) && e.target.tagName !== 'IMG') deselectImg();
  });

  // ── Iframe detection ──────────────────────────────
  if (window.self !== window.top) {
    document.querySelector('header').style.display    = 'none';
    document.querySelector('.nav-todo').style.display = 'none';
    document.body.style.background = 'transparent';
  }

  // ── Ctrl+Enter → déclenche l'IA dans le parent ────
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') {
      e.preventDefault();
      const sel = window.getSelection();
      const selectedText = (sel && !sel.isCollapsed && el.contains(sel.anchorNode))
        ? sel.toString().trim() : '';
      window.parent.postMessage({
        type: 'trigger-ai',
        selectedText,
        text: el.innerText
      }, '*');
    }
    if (e.ctrlKey && e.shiftKey && e.key === 'A') {
      e.preventDefault();
      insertCheckbox();
    }
    if (e.ctrlKey && e.key === 'k') {
      e.preventDefault();
      insertLink();
    }
    if (e.ctrlKey && e.key === 'f') {
      e.preventDefault();
      openSearch();
    }
    if (e.key === 'Escape' && _searchActive) {
      e.preventDefault();
      closeSearch();
    }
  });

  // Listen for open-search message from parent frame
  window.addEventListener('message', e => {
    if (e.data?.type === 'open-search') openSearch();
  });

  // ── Formatage ─────────────────────────────────────
  window.insertLink = function() {
    el.focus();
    const sel = window.getSelection();
    let url;
    if (sel && !sel.isCollapsed) {
      url = sel.toString().trim();
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    } else {
      url = prompt('URL:');
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    }
    document.execCommand('createLink', false, url);
    // Ensure all links open in a new tab
    el.querySelectorAll('a').forEach(a => {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    });
    scheduleNotesSave();
  };

  window.fmt = function(cmd) {
    document.execCommand(cmd, false, null);
    el.focus();
  };
  window.fmtColor = function(type, color) {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
    el.focus();
    if (type === 'fore') {
      document.execCommand('styleWithCSS', false, true);
      document.execCommand('foreColor', false, color);
    } else {
      // Manual wrap to avoid applying background to the whole block element
      const range = sel.getRangeAt(0);
      const span = document.createElement('span');
      span.style.backgroundColor = color;
      try {
        range.surroundContents(span);
      } catch {
        // Fallback if selection crosses element boundaries
        document.execCommand('styleWithCSS', false, true);
        document.execCommand('hiliteColor', false, color);
      }
      sel.removeAllRanges();
      scheduleNotesSave();
    }
  };
  window.fmtSize = function(size) {
    if (!size) return;
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('fontSize', false, size);
    el.focus();
  };
  window.fmtClear = function() {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
    document.execCommand('styleWithCSS', false, false); // reset sticky state before removeFormat
    document.execCommand('removeFormat', false, null);
    el.focus();
    scheduleNotesSave();
  };
</script>

</body>
</html>
